<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #222;
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .chat {
      height: calc(100vh - 150px);
      overflow-y: auto;
      padding: 30px 20px 120px;
    }

    .welcome {
      max-width: 600px;
      margin: 120px auto 0;
      text-align: center;
    }

    .welcome h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .welcome p {
      color: #888;
    }

    .message {
      max-width: 700px;
      margin: 15px auto;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .user {
      background: #1a1a1a;
      text-align: right;
    }

    .ai {
      background: #101010;
      border: 1px solid #222;
    }

    .input-area {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 700px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      padding: 15px 20px;
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NEXORA AI</div>
  </header>

  <main id="chat" class="chat">

    <div id="welcome" class="welcome">
      <h1>Halo, saya Nexora AI.</h1>
      <p>Apa yang ingin kamu lakukan hari ini?</p>
    </div>

  </main>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Tanyakan sesuatu kepada Nexora AI..."
      autocomplete="off"
    >

    <button id="sendButton">
      Kirim
    </button>

  </div>

  <script>
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    function sendMessage() {
      const message = input.value.trim();

      if (message === "") {
        return;
      }

      welcome.style.display = "none";

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent =
        "Halo! Saya Nexora AI. Pesan kamu sudah diterima. 🤖";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
