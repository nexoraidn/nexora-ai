  </div>  <script>

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const newChatButton =
      document.getElementById("newChatButton");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");

    const historyButton =
      document.getElementById("historyButton");

    const historyPanel =
      document.getElementById("historyPanel");

    const historyOverlay =
      document.getElementById("historyOverlay");

    const closeHistoryButton =
      document.getElementById("closeHistoryButton");

    const historyList =
      document.getElementById("historyList");

    /* =========================
       MULTI CONVERSATION
    ========================= */

    const CHATS_KEY =
      "nexora_ai_chats";

    const ACTIVE_CHAT_KEY =
      "nexora_ai_active_chat";

    let conversations = [];

    let activeChatId = null;

    /* =========================
       CREATE CONVERSATION
    ========================= */

    function createConversation() {

      const conversation = {

        id: Date.now().toString(),

        title: "Percakapan baru",

        messages: [],

        createdAt: Date.now(),

        updatedAt: Date.now()

      };

      conversations.push(
        conversation
      );

      activeChatId =
        conversation.id;

      saveConversations();

      renderHistory();

      return conversation;
    }

    /* =========================
       GET ACTIVE CONVERSATION
    ========================= */

    function getActiveConversation() {

      return conversations.find(
        (conversation) =>
          conversation.id ===
          activeChatId
      );

    }

    /* =========================
       SAVE CONVERSATIONS
    ========================= */

    function saveConversations() {

      try {

        localStorage.setItem(
          CHATS_KEY,
          JSON.stringify(
            conversations
          )
        );

        localStorage.setItem(
          ACTIVE_CHAT_KEY,
          activeChatId || ""
        );

      } catch (error) {

        console.error(
          "Gagal menyimpan percakapan:",
          error
        );

      }

    }

    /* =========================
       LOAD CONVERSATIONS
    ========================= */

    function loadConversations() {

      try {

        const savedChats =
          localStorage.getItem(
            CHATS_KEY
          );

        const savedActiveChat =
          localStorage.getItem(
            ACTIVE_CHAT_KEY
          );

        if (savedChats) {

          conversations =
            JSON.parse(
              savedChats
            );

        }

        if (savedActiveChat) {

          activeChatId =
            savedActiveChat;

        }

      } catch (error) {

        console.error(
          "Gagal membaca percakapan:",
          error
        );

        conversations = [];

        activeChatId = null;

      }

      migrateOldHistory();

      if (
        conversations.length === 0
      ) {

        createConversation();

      }

      const activeConversation =
        getActiveConversation();

      if (!activeConversation) {

        const lastConversation =
          conversations[
            conversations.length - 1
          ];

        activeChatId =
          lastConversation.id;

        saveConversations();

      }

      renderActiveConversation();

      renderHistory();

    }

    /* =========================
       MIGRATE OLD HISTORY
    ========================= */

    function migrateOldHistory() {

      const OLD_STORAGE_KEY =
        "nexora_ai_chat_history";

      try {

        const oldHistory =
          localStorage.getItem(
            OLD_STORAGE_KEY
          );

        if (
          !oldHistory ||
          conversations.length > 0
        ) {

          return;

        }

        const messages =
          JSON.parse(
            oldHistory
          );

        if (
          !Array.isArray(messages) ||
          messages.length === 0
        ) {

          return;

        }

        const firstUserMessage =
          messages.find(
            (item) =>
              item.role === "user"
          );

        const title =
          firstUserMessage &&
          firstUserMessage.content
            ? firstUserMessage.content
                .slice(0, 40)
            : "Percakapan sebelumnya";

        const migratedConversation = {

          id:
            Date.now().toString(),

          title:
            title,

          messages:
            messages,

          createdAt:
            messages[0].timestamp ||
            Date.now(),

          updatedAt:
            messages[
              messages.length - 1
            ].timestamp ||
            Date.now()

        };

        conversations.push(
          migratedConversation
        );

        activeChatId =
          migratedConversation.id;

        saveConversations();

        localStorage.removeItem(
          OLD_STORAGE_KEY
        );

      } catch (error) {

        console.error(
          "Gagal migrasi riwayat lama:",
          error
        );

      }

    }

    /* =========================
       CLEAR DISPLAY
    ========================= */

    function clearChatDisplay() {

      const messages =
        chat.querySelectorAll(
          ".message-wrapper"
        );

      messages.forEach(
        (message) => {
          message.remove();
        }
      );

    }

    /* =========================
       RENDER ACTIVE CHAT
    ========================= */

    function renderActiveConversation() {

      clearChatDisplay();

      const conversation =
        getActiveConversation();

      if (
        !conversation ||
        conversation.messages.length === 0
      ) {

        welcome.style.display =
          "block";

        return;

      }

      welcome.style.display =
        "none";

      conversation.messages.forEach(
        (item) => {

          createMessageElement(
            item.role,
            item.content
          );

        }
      );

      setTimeout(() => {

        chat.scrollTop =
          chat.scrollHeight;

      }, 50);

    }

    /* =========================
       RENDER CHAT HISTORY
    ========================= */

    function renderHistory() {

      historyList.innerHTML = "";

      if (
        conversations.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "history-empty";

        empty.textContent =
          "Belum ada percakapan.";

        historyList.appendChild(
          empty
        );

        return;

      }

      const sortedConversations =
        [...conversations].sort(
          (a, b) =>
            (b.updatedAt || b.createdAt || 0) -
            (a.updatedAt || a.createdAt || 0)
        );

      sortedConversations.forEach(
        (conversation) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "history-item";

          if (
            conversation.id ===
            activeChatId
          ) {

            item.classList.add(
              "active"
            );

          }

          const content =
            document.createElement(
              "div"
            );

          content.className =
            "history-item-content";

          const title =
            document.createElement(
              "div"
            );

          title.className =
            "history-item-title";

          title.textContent =
            conversation.title ||
            "Percakapan baru";

          const date =
            document.createElement(
              "div"
            );

          date.className =
            "history-item-date";

          date.textContent =
            formatDate(
              conversation.updatedAt ||
              conversation.createdAt
            );

          content.appendChild(
            title
          );

          content.appendChild(
            date
          );

          /* =========================
             MENU BUTTON
          ========================= */

          const menuButton =
            document.createElement(
              "button"
            );

          menuButton.className =
            "history-menu-button";

          menuButton.type =
            "button";

          menuButton.textContent =
            "⋮";

          menuButton.title =
            "Opsi percakapan";

          menuButton.setAttribute(
            "aria-label",
            "Opsi percakapan"
          );

          menuButton.addEventListener(
            "click",
            (event) => {

              event.stopPropagation();

              showConversationMenu(
                conversation
              );

            }
          );

          item.appendChild(
            content
          );

          item.appendChild(
            menuButton
          );

          item.addEventListener(
            "click",
            () => {

              openConversation(
                conversation.id
              );

            }
          );

          historyList.appendChild(
            item
          );

        }
      );

    }

    /* =========================
       CONVERSATION MENU
    ========================= */

    function showConversationMenu(
      conversation
    ) {

      const action =
        prompt(
          "Pilih aksi untuk percakapan:\n\n1 = Rename\n2 = Delete",
          "1"
        );

      if (
        action === null
      ) {

        return;

      }

      if (
        action.trim() === "1"
      ) {

        renameConversation(
          conversation
        );

        return;

      }

      if (
        action.trim() === "2"
      ) {

        deleteConversation(
          conversation
        );

        return;

      }

      alert(
        "Pilihan tidak valid.\nGunakan 1 untuk Rename atau 2 untuk Delete."
      );

    }

    /* =========================
       RENAME CONVERSATION
    ========================= */

    function renameConversation(
      conversation
    ) {

      const currentTitle =
        conversation.title ||
        "Percakapan baru";

      const newTitle =
        prompt(
          "Ganti nama percakapan:",
          currentTitle
        );

      if (
        newTitle === null
      ) {

        return;

      }

      const trimmedTitle =
        newTitle.trim();

      if (!trimmedTitle) {

        alert(
          "Nama percakapan tidak boleh kosong."
        );

        return;

      }

      conversation.title =
        trimmedTitle.slice(0, 80);

      conversation.updatedAt =
        Date.now();

      saveConversations();

      renderHistory();

    }

    /* =========================
       DELETE CONVERSATION
    ========================= */

    function deleteConversation(
      conversation
    ) {

      const confirmed =
        confirm(
          'Hapus percakapan "' +
          (conversation.title ||
            "Percakapan baru") +
          '"?\n\nPercakapan yang dihapus tidak dapat dikembalikan.'
        );

      if (!confirmed) {

        return;

      }

      const deletedId =
        conversation.id;

      conversations =
        conversations.filter(
          (item) =>
            item.id !== deletedId
        );

      /* Jika yang dihapus adalah chat aktif */

      if (
        activeChatId === deletedId
      ) {

        if (
          conversations.length > 0
        ) {

          const nextConversation =
            [...conversations].sort(
              (a, b) =>
                (b.updatedAt || b.createdAt || 0) -
                (a.updatedAt || a.createdAt || 0)
            )[0];

          activeChatId =
            nextConversation.id;

        } else {

          activeChatId =
            null;

          createConversation();

        }

        saveConversations();

        renderActiveConversation();

      }

      saveConversations();

      renderHistory();

    }

    /* =========================
       FORMAT DATE
    ========================= */

    function formatDate(timestamp) {

      if (!timestamp) {

        return "";

      }

      const date =
        new Date(timestamp);

      const now =
        new Date();

      const isToday =
        date.toDateString() ===
        now.toDateString();

      if (isToday) {

        return (
          "Hari ini • " +
          date.toLocaleTimeString(
            "id-ID",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        );

      }

      const yesterday =
        new Date();

      yesterday.setDate(
        yesterday.getDate() - 1
      );

      if (
        date.toDateString() ===
        yesterday.toDateString()
      ) {

        return "Kemarin";

      }

      return date.toLocaleDateString(
        "id-ID",
        {
          day: "numeric",
          month: "short",
          year: "numeric"
        }
      );

    }

    /* =========================
       OPEN CONVERSATION
    ========================= */

    function openConversation(
      conversationId
    ) {

      const conversation =
        conversations.find(
          (item) =>
            item.id ===
            conversationId
        );

      if (!conversation) {

        return;

      }

      activeChatId =
        conversation.id;

      saveConversations();

      renderActiveConversation();

      renderHistory();

      closeHistory();

      input.focus();

    }

    /* =========================
       HISTORY PANEL
    ========================= */

    function openHistory() {

      historyPanel.classList.add(
        "show"
      );

      historyOverlay.classList.add(
        "show"
      );

      renderHistory();

    }

    function closeHistory() {

      historyPanel.classList.remove(
        "show"
      );

      historyOverlay.classList.remove(
        "show"
      );

    }

    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessageToHistory(
      role,
      content
    ) {

      const conversation =
        getActiveConversation();

      if (!conversation) {

        return;

      }

      conversation.messages.push({

        role:
          role,

        content:
          content,

        timestamp:
          Date.now()

      });

      if (
        role === "user" &&
        conversation.title ===
          "Percakapan baru"
      ) {

        conversation.title =
          content.slice(0, 40);

      }

      conversation.updatedAt =
        Date.now();

      saveConversations();

      renderHistory();

    }

    /* =========================
       CREATE MESSAGE ELEMENT
    ========================= */

    function createMessageElement(
      role,
      content
    ) {

      const wrapper =
        document.createElement(
          "div"
        );

      if (role === "user") {

        wrapper.className =
          "message-wrapper user-wrapper";

      } else {

        wrapper.className =
          "message-wrapper ai-wrapper";

      }

      const message =
        document.createElement(
          "div"
        );

      message.className =
        role === "user"
          ? "message user"
          : "message ai";

      message.textContent =
        content;

      wrapper.appendChild(
        message
      );

      chat.appendChild(
        wrapper
      );

      return message;

    }

    /* =========================
       NEW CHAT
    ========================= */

    function startNewChat() {

      if (button.disabled) {

        return;

      }

      const currentConversation =
        getActiveConversation();

      const hasMessages =
        currentConversation &&
        currentConversation.messages.length > 0;

      if (hasMessages) {

        const confirmed =
          confirm(
            "Mulai chat baru?\n\nPercakapan saat ini tetap tersimpan di browser."
          );

        if (!confirmed) {

          return;

        }

      }

      createConversation();

      renderActiveConversation();

      input.value = "";

      input.disabled = false;

      button.disabled = false;

      newChatButton.disabled = false;

      button.textContent =
        "Kirim";

      input.focus();

      chat.scrollTop = 0;

    }

    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const message =
        input.value.trim();

      if (
        !message ||
        button.disabled
      ) {

        return;

      }

      const conversation =
        getActiveConversation();

      if (!conversation) {

        createConversation();

      }

      welcome.style.display =
        "none";

      /* Simpan pesan user */

      addMessageToHistory(
        "user",
        message
      );

      /* Tampilkan pesan user */

      createMessageElement(
        "user",
        message
      );

      input.value = "";

      button.disabled = true;

      newChatButton.disabled =
        true;

      input.disabled = true;

      button.textContent =
        "Menjawab...";

      /* AI THINKING */

      const aiWrapper =
        document.createElement(
          "div"
        );

      aiWrapper.className =
        "message-wrapper ai-wrapper";

      const aiMessage =
        document.createElement(
          "div"
        );

      aiMessage.className =
        "message ai";

      const thinking =
        document.createElement(
          "div"
        );

      thinking.className =
        "thinking";

      thinking.innerHTML = `
        <span>Nexora sedang berpikir</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      `;

      aiMessage.appendChild(
        thinking
      );

      aiWrapper.appendChild(
        aiMessage
      );

      chat.appendChild(
        aiWrapper
      );

      chat.scrollTop =
        chat.scrollHeight;

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message:
                  message
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Terjadi kesalahan pada server."
          );

        }

        const reply =
          data.reply ||
          "Nexora tidak memberikan jawaban.";

        /* Tampilkan jawaban AI */

        aiMessage.textContent =
          reply;

        /* Simpan jawaban AI */

        addMessageToHistory(
          "ai",
          reply
        );

      } catch (error) {

        console.error(
          "Nexora error:",
          error
        );

        const errorMessage =
          "Error Nexora: " +
          error.message;

        aiMessage.textContent =
          errorMessage;

        /* Simpan error */

        addMessageToHistory(
          "ai",
          errorMessage
        );

      }

      button.disabled = false;

      newChatButton.disabled =
        false;

      input.disabled = false;

      button.textContent =
        "Kirim";

      input.focus();

      chat.scrollTop =
        chat.scrollHeight;

    }

    /* =========================
       EVENTS
    ========================= */

    button.addEventListener(
      "click",
      sendMessage
    );

    newChatButton.addEventListener(
      "click",
      startNewChat
    );

    historyButton.addEventListener(
      "click",
      openHistory
    );

    closeHistoryButton.addEventListener(
      "click",
      closeHistory
    );

    historyOverlay.addEventListener(
      "click",
      closeHistory
    );

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          sendMessage();

        }

      }
    );

    /* =========================
       LOAD
    ========================= */

    loadConversations();

    /* =========================
       PWA
    ========================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker.register(
            "/service-worker.js"
          );

        }
      );

    }

  </script></body>
</html>
