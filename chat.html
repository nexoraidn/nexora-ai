<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora AI Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #222;
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .chat {
      height: calc(100vh - 150px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    p {
      color: #888;
      line-height: 1.6;
    }

    .input-area {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 700px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      outline: none;
    }

    button {
      padding: 15px 20px;
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NEXORA AI</div>
  </header>

  <main class="chat">

    <div class="welcome">
      <h1>Halo, saya Nexora AI.</h1>

      <p>
        Apa yang ingin kamu lakukan hari ini?
      </p>
    </div>

  </main>

  <div class="input-area">

    <input
      type="text"
      placeholder="Tanyakan sesuatu kepada Nexora AI..."
    >

    <button>
      Kirim
    </button>

  </div>

</body>
</html>
