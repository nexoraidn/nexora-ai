<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora AI</title>

  <meta
    name="description"
    content="Nexora AI - Intelligent technology for a smarter future."
  >

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: #ffffff;
      overflow: hidden;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid #1f1f1f;
      background: rgba(5, 5, 5, 0.95);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .chat {
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 30px 20px 120px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 10px;
    }

    .welcome {
      max-width: 700px;
      margin: 15vh auto 0;
      text-align: center;
      padding: 20px;
    }

    .welcome h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin-bottom: 14px;
      letter-spacing: -1px;
    }

    .welcome p {
      color: #888888;
      font-size: 16px;
    }

    .message-wrapper {
      max-width: 760px;
      margin: 18px auto;
      display: flex;
    }

    .message-wrapper.user-wrapper {
      justify-content: flex-end;
    }

    .message-wrapper.ai-wrapper {
      justify-content: flex-start;
    }

    .message {
      max-width: 80%;
      padding: 14px 17px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #ffffff;
      color: #000000;
      border-bottom-right-radius: 5px;
    }

    .ai {
      background: #111111;
      border: 1px solid #242424;
      color: #eeeeee;
      border-bottom-left-radius: 5px;
    }

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #888888;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(92%, 760px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      background: transparent;
      border: none;
      color: #ffffff;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: #666666;
    }

    button {
      padding: 12px 18px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }

    /* =========================
       NEW CHAT BUTTON
    ========================= */

    .new-chat-button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      padding: 0;
      background: #111111;
      color: #ffffff;
      border: 1px solid #292929;
      border-radius: 12px;
      font-size: 25px;
      font-weight: 400;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .new-chat-button:hover {
      background: #181818;
      opacity: 1;
      transform: translateY(-1px);
    }

    .new-chat-button:active {
      transform: scale(0.95);
    }

    .new-chat-button:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .chat {
        padding: 20px 12px 110px;
      }

      .welcome {
        margin-top: 18vh;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .message {
        max-width: 88%;
        font-size: 14px;
      }

      .input-area {
        bottom: 10px;
        width: 94%;
      }

      .input-area button#sendButton {
        padding: 12px 15px;
      }

      .new-chat-button {
        width: 38px;
        height: 38px;
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NEXORA AI</div>
  </header>

  <main id="chat" class="chat">

    <div id="welcome" class="welcome">
      <h1>Halo, saya Nexora AI.</h1>
      <p>Apa yang ingin kamu lakukan hari ini?</p>
    </div>

  </main>

  <!-- =========================
       INPUT AREA
  ========================= -->

  <div class="input-area">

    <button
      id="newChatButton"
      class="new-chat-button"
      aria-label="Chat baru"
      title="Chat baru"
    >
      +
    </button>

    <input
      id="messageInput"
      type="text"
      placeholder="Tanyakan sesuatu kepada Nexora AI..."
      autocomplete="off"
    >

    <button id="sendButton">
      Kirim
    </button>

  </div>

  <script>
    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const newChatButton =
      document.getElementById("newChatButton");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");

    /* =========================
       MULTI CONVERSATION
    ========================= */

    const CHATS_KEY =
      "nexora_ai_chats";

    const ACTIVE_CHAT_KEY =
      "nexora_ai_active_chat";

    let conversations = [];

    let activeChatId = null;

    /* =========================
       CREATE CONVERSATION
    ========================= */

    function createConversation() {

      const conversation = {

        id: Date.now().toString(),

        title: "Percakapan baru",

        messages: [],

        createdAt: Date.now(),

        updatedAt: Date.now()

      };

      conversations.push(
        conversation
      );

      activeChatId =
        conversation.id;

      saveConversations();

      return conversation;
    }

    /* =========================
       GET ACTIVE CONVERSATION
    ========================= */

    function getActiveConversation() {

      return conversations.find(
        (conversation) =>
          conversation.id ===
          activeChatId
      );
    }

    /* =========================
       SAVE CONVERSATIONS
    ========================= */

    function saveConversations() {

      try {

        localStorage.setItem(
          CHATS_KEY,
          JSON.stringify(
            conversations
          )
        );

        localStorage.setItem(
          ACTIVE_CHAT_KEY,
          activeChatId || ""
        );

      } catch (error) {

        console.error(
          "Gagal menyimpan percakapan:",
          error
        );

      }

    }

    /* =========================
       LOAD CONVERSATIONS
    ========================= */

    function loadConversations() {

      try {

        const savedChats =
          localStorage.getItem(
            CHATS_KEY
          );

        const savedActiveChat =
          localStorage.getItem(
            ACTIVE_CHAT_KEY
          );

        if (savedChats) {

          conversations =
            JSON.parse(
              savedChats
            );

        }

        if (savedActiveChat) {

          activeChatId =
            savedActiveChat;

        }

      } catch (error) {

        console.error(
          "Gagal membaca percakapan:",
          error
        );

        conversations = [];

        activeChatId = null;

      }

      migrateOldHistory();

      if (
        conversations.length === 0
      ) {

        createConversation();

      }

      const activeConversation =
        getActiveConversation();

      if (!activeConversation) {

        const lastConversation =
          conversations[
            conversations.length - 1
          ];

        activeChatId =
          lastConversation.id;

        saveConversations();

      }

      renderActiveConversation();

    }

    /* =========================
       MIGRATE OLD HISTORY
    ========================= */

    function migrateOldHistory() {

      const OLD_STORAGE_KEY =
        "nexora_ai_chat_history";

      try {

        const oldHistory =
          localStorage.getItem(
            OLD_STORAGE_KEY
          );

        if (
          !oldHistory ||
          conversations.length > 0
        ) {

          return;

        }

        const messages =
          JSON.parse(
            oldHistory
          );

        if (
          !Array.isArray(messages) ||
          messages.length === 0
        ) {

          return;

        }

        const firstUserMessage =
          messages.find(
            (item) =>
              item.role === "user"
          );

        const title =
          firstUserMessage &&
          firstUserMessage.content
            ? firstUserMessage.content
                .slice(0, 40)
            : "Percakapan sebelumnya";

        const migratedConversation = {

          id:
            Date.now().toString(),

          title:
            title,

          messages:
            messages,

          createdAt:
            messages[0].timestamp ||
            Date.now(),

          updatedAt:
            messages[
              messages.length - 1
            ].timestamp ||
            Date.now()

        };

        conversations.push(
          migratedConversation
        );

        activeChatId =
          migratedConversation.id;

        saveConversations();

        localStorage.removeItem(
          OLD_STORAGE_KEY
        );

      } catch (error) {

        console.error(
          "Gagal migrasi riwayat lama:",
          error
        );

      }

    }

    /* =========================
       CLEAR DISPLAY
    ========================= */

    function clearChatDisplay() {

      const messages =
        chat.querySelectorAll(
          ".message-wrapper"
        );

      messages.forEach(
        (message) => {
          message.remove();
        }
      );

    }

    /* =========================
       RENDER ACTIVE CHAT
    ========================= */

    function renderActiveConversation() {

      clearChatDisplay();

      const conversation =
        getActiveConversation();

      if (
        !conversation ||
        conversation.messages.length === 0
      ) {

        welcome.style.display =
          "block";

        return;

      }

      welcome.style.display =
        "none";

      conversation.messages.forEach(
        (item) => {

          createMessageElement(
            item.role,
            item.content
          );

        }
      );

      setTimeout(() => {

        chat.scrollTop =
          chat.scrollHeight;

      }, 50);

    }

    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessageToHistory(
      role,
      content
    ) {

      const conversation =
        getActiveConversation();

      if (!conversation) {

        return;

      }

      conversation.messages.push({

        role:
          role,

        content:
          content,

        timestamp:
          Date.now()

      });

      if (
        role === "user" &&
        conversation.title ===
          "Percakapan baru"
      ) {

        conversation.title =
          content.slice(0, 40);

      }

      conversation.updatedAt =
        Date.now();

      saveConversations();

    }

    /* =========================
       CREATE MESSAGE ELEMENT
    ========================= */

    function createMessageElement(
      role,
      content
    ) {

      const wrapper =
        document.createElement(
          "div"
        );

      if (role === "user") {

        wrapper.className =
          "message-wrapper user-wrapper";

      } else {

        wrapper.className =
          "message-wrapper ai-wrapper";

      }

      const message =
        document.createElement(
          "div"
        );

      message.className =
        role === "user"
          ? "message user"
          : "message ai";

      message.textContent =
        content;

      wrapper.appendChild(
        message
      );

      chat.appendChild(
        wrapper
      );

      return message;

    }

    /* =========================
       NEW CHAT
    ========================= */

    function startNewChat() {

      if (button.disabled) {

        return;

      }

      const currentConversation =
        getActiveConversation();

      const hasMessages =
        currentConversation &&
        currentConversation.messages.length > 0;

      if (hasMessages) {

        const confirmed =
          confirm(
            "Mulai chat baru?\n\nPercakapan saat ini tetap tersimpan di browser."
          );

        if (!confirmed) {

          return;

        }

      }

      createConversation();

      renderActiveConversation();

      input.value = "";

      input.disabled = false;

      button.disabled = false;

      newChatButton.disabled = false;

      button.textContent =
        "Kirim";

      input.focus();

      chat.scrollTop = 0;

    }

    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const message =
        input.value.trim();

      if (
        !message ||
        button.disabled
      ) {

        return;

      }

      const conversation =
        getActiveConversation();

      if (!conversation) {

        createConversation();

      }

      welcome.style.display =
        "none";

      /* Simpan pesan user */

      addMessageToHistory(
        "user",
        message
      );

      /* Tampilkan pesan user */

      createMessageElement(
        "user",
        message
      );

      input.value = "";

      button.disabled = true;

      newChatButton.disabled =
        true;

      input.disabled = true;

      button.textContent =
        "Menjawab...";

      /* AI THINKING */

      const aiWrapper =
        document.createElement(
          "div"
        );

      aiWrapper.className =
        "message-wrapper ai-wrapper";

      const aiMessage =
        document.createElement(
          "div"
        );

      aiMessage.className =
        "message ai";

      const thinking =
        document.createElement(
          "div"
        );

      thinking.className =
        "thinking";

      thinking.innerHTML = `
        <span>Nexora sedang berpikir</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      `;

      aiMessage.appendChild(
        thinking
      );

      aiWrapper.appendChild(
        aiMessage
      );

      chat.appendChild(
        aiWrapper
      );

      chat.scrollTop =
        chat.scrollHeight;

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message:
                  message
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Terjadi kesalahan pada server."
          );

        }

        const reply =
          data.reply ||
          "Nexora tidak memberikan jawaban.";

        /* Tampilkan jawaban AI */

        aiMessage.textContent =
          reply;

        /* Simpan jawaban AI */

        addMessageToHistory(
          "ai",
          reply
        );

      } catch (error) {

        console.error(
          "Nexora error:",
          error
        );

        const errorMessage =
          "Error Nexora: " +
          error.message;

        aiMessage.textContent =
          errorMessage;

        /* Simpan error */

        addMessageToHistory(
          "ai",
          errorMessage
        );

      }

      button.disabled = false;

      newChatButton.disabled =
        false;

      input.disabled = false;

      button.textContent =
        "Kirim";

      input.focus();

      chat.scrollTop =
        chat.scrollHeight;

    }

    /* =========================
       EVENTS
    ========================= */

    button.addEventListener(
      "click",
      sendMessage
    );

    newChatButton.addEventListener(
      "click",
      startNewChat
    );

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          sendMessage();

        }

      }
    );

    /* =========================
       LOAD
    ========================= */

    loadConversations();

    /* =========================
       PWA
    ========================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker.register(
            "/service-worker.js"
          );

        }
      );

    }
  </script>

</body>
</html>
