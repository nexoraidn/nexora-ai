<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora AI</title>

  <meta
    name="description"
    content="Nexora AI - Intelligent technology for a smarter future."
  >

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: #ffffff;
      overflow: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid #1f1f1f;
      background: rgba(5, 5, 5, 0.95);
      z-index: 20;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .history-button {
      position: absolute;
      left: 14px;
      width: 40px;
      height: 40px;
      padding: 0;
      background: #111111;
      color: #ffffff;
      border: 1px solid #292929;
      border-radius: 11px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .history-button:hover {
      background: #181818;
      opacity: 1;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 30px 20px 120px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 10px;
    }

    .welcome {
      max-width: 700px;
      margin: 15vh auto 0;
      text-align: center;
      padding: 20px;
    }

    .welcome h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin-bottom: 14px;
      letter-spacing: -1px;
    }

    .welcome p {
      color: #888888;
      font-size: 16px;
    }

    .message-wrapper {
      max-width: 760px;
      margin: 18px auto;
      display: flex;
    }

    .message-wrapper.user-wrapper {
      justify-content: flex-end;
    }

    .message-wrapper.ai-wrapper {
      justify-content: flex-start;
    }

    .message {
      max-width: 80%;
      padding: 14px 17px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #ffffff;
      color: #000000;
      border-bottom-right-radius: 5px;
    }

    .ai {
      background: #111111;
      border: 1px solid #242424;
      color: #eeeeee;
      border-bottom-left-radius: 5px;
    }

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #888888;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(92%, 760px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 15;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      background: transparent;
      border: none;
      color: #ffffff;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: #666666;
    }

    button {
      padding: 12px 18px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }

    /* =========================
       NEW CHAT BUTTON
    ========================= */

    .new-chat-button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      padding: 0;
      background: #111111;
      color: #ffffff;
      border: 1px solid #292929;
      border-radius: 12px;
      font-size: 25px;
      font-weight: 400;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .new-chat-button:hover {
      background: #181818;
      opacity: 1;
      transform: translateY(-1px);
    }

    .new-chat-button:active {
      transform: scale(0.95);
    }

    /* =========================
       HISTORY PANEL
    ========================= */

    .history-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      visibility: hidden;
      transition: 0.2s ease;
      z-index: 30;
    }

    .history-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .history-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: min(86%, 340px);
      height: 100vh;
      background: #0a0a0a;
      border-right: 1px solid #242424;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 31;
      display: flex;
      flex-direction: column;
    }

    .history-panel.show {
      transform: translateX(0);
    }

    .history-header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #202020;
    }

    .history-title {
      font-size: 17px;
      font-weight: 700;
    }

    .history-count {
      margin-left: 6px;
      color: #666666;
      font-size: 12px;
      font-weight: 400;
    }

    .close-history {
      width: 38px;
      height: 38px;
      padding: 0;
      background: #111111;
      color: #ffffff;
      border: 1px solid #292929;
      border-radius: 10px;
      font-size: 20px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .history-list::-webkit-scrollbar {
      width: 5px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: #292929;
      border-radius: 10px;
    }

    .history-empty {
      color: #666666;
      text-align: center;
      padding: 30px 15px;
      font-size: 14px;
    }

    /* =========================
       HISTORY ITEM
    ========================= */

    .history-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      padding: 10px;
      margin-bottom: 7px;
      background: transparent;
      color: #dddddd;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .history-item:hover {
      background: #111111;
      border-color: #202020;
      transform: none;
      opacity: 1;
    }

    .history-item.active {
      background: #151515;
      border-color: #303030;
    }

    .history-item-content {
      flex: 1;
      min-width: 0;
      padding: 3px 4px;
    }

    .history-item-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .history-item-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-active-label {
      flex-shrink: 0;
      padding: 3px 6px;
      border-radius: 6px;
      background: #222222;
      border: 1px solid #333333;
      color: #aaaaaa;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-item-date {
      margin-top: 5px;
      color: #666666;
      font-size: 11px;
    }

    /* =========================
       DELETE BUTTON
    ========================= */

    .history-delete-button {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      padding: 0;
      background: transparent;
      color: #777777;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .history-delete-button:hover {
      background: #222222;
      color: #ffffff;
      border-color: #333333;
      transform: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .chat {
        padding: 20px 12px 110px;
      }

      .welcome {
        margin-top: 18vh;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .message {
        max-width: 88%;
        font-size: 14px;
      }

      .input-area {
        bottom: 10px;
        width: 94%;
      }

      .input-area button#sendButton {
        padding: 12px 15px;
      }

      .new-chat-button {
        width: 38px;
        height: 38px;
        font-size: 23px;
      }

      .history-panel {
        width: 88%;
      }

      .history-item {
        padding: 9px;
      }

      .history-item-title {
        font-size: 13px;
      }

      .history-active-label {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HISTORY PANEL
  ========================= -->

  <div
    id="historyOverlay"
    class="history-overlay"
  ></div>

  <aside
    id="historyPanel"
    class="history-panel"
  >

    <div class="history-header">

      <div class="history-title">
        Chat History
        <span
          id="historyCount"
          class="history-count"
        ></span>
      </div>

      <button
        id="closeHistoryButton"
        class="close-history"
        aria-label="Tutup"
      >
        ×
      </button>

    </div>

    <div
      id="historyList"
      class="history-list"
    ></div>

  </aside>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <button
      id="historyButton"
      class="history-button"
      aria-label="Chat History"
      title="Chat History"
    >
      ☰
    </button>

    <div class="logo">
      NEXORA AI
    </div>

  </header>


  <!-- =========================
       CHAT
  ========================= -->

  <main
    id="chat"
    class="chat"
  >

    <div
      id="welcome"
      class="welcome"
    >

      <h1>Halo, saya Nexora AI.</h1>

      <p>
        Apa yang ingin kamu lakukan hari ini?
      </p>

    </div>

  </main>


  <!-- =========================
       INPUT AREA
  ========================= -->

  <div class="input-area">

    <button
      id="newChatButton"
      class="new-chat-button"
      aria-label="Chat baru"
      title="Chat baru"
    >
      +
    </button>

    <input
      id="messageInput"
      type="text"
      placeholder="Tanyakan sesuatu kepada Nexora AI..."
      autocomplete="off"
    >

    <button id="sendButton">
      Kirim
    </button>

  </div>


  <script>

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const newChatButton =
      document.getElementById("newChatButton");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");

    const historyButton =
      document.getElementById("historyButton");

    const historyPanel =
      document.getElementById("historyPanel");

    const historyOverlay =
      document.getElementById("historyOverlay");

    const closeHistoryButton =
      document.getElementById("closeHistoryButton");

    const historyList =
      document.getElementById("historyList");

    const historyCount =
      document.getElementById("historyCount");


    /* =========================
       MULTI CONVERSATION
    ========================= */

    const CHATS_KEY =
      "nexora_ai_chats";

    const ACTIVE_CHAT_KEY =
      "nexora_ai_active_chat";

    let conversations = [];

    let activeChatId = null;


    /* =========================
       CREATE CONVERSATION
    ========================= */

    function createConversation() {

      const conversation = {

        id:
          Date.now().toString(),

        title:
          "Percakapan baru",

        messages:
          [],

        createdAt:
          Date.now(),

        updatedAt:
          Date.now()

      };

      conversations.push(
        conversation
      );

      activeChatId =
        conversation.id;

      saveConversations();

      renderHistory();

      return conversation;

    }


    /* =========================
       GET ACTIVE CONVERSATION
    ========================= */

    function getActiveConversation() {

      return conversations.find(
        (conversation) =>
          conversation.id ===
          activeChatId
      );

    }


    /* =========================
       SAVE CONVERSATIONS
    ========================= */

    function saveConversations() {

      try {

        localStorage.setItem(
          CHATS_KEY,
          JSON.stringify(
            conversations
          )
        );

        localStorage.setItem(
          ACTIVE_CHAT_KEY,
          activeChatId || ""
        );

      } catch (error) {

        console.error(
          "Gagal menyimpan percakapan:",
          error
        );

      }

    }


    /* =========================
       LOAD CONVERSATIONS
    ========================= */

    function loadConversations() {

      try {

        const savedChats =
          localStorage.getItem(
            CHATS_KEY
          );

        const savedActiveChat =
          localStorage.getItem(
            ACTIVE_CHAT_KEY
          );

        if (savedChats) {

          conversations =
            JSON.parse(
              savedChats
            );

        }

        if (savedActiveChat) {

          activeChatId =
            savedActiveChat;

        }

      } catch (error) {

        console.error(
          "Gagal membaca percakapan:",
          error
        );

        conversations = [];

        activeChatId = null;

      }

      migrateOldHistory();


      if (
        conversations.length === 0
      ) {

        createConversation();

      }


      const activeConversation =
        getActiveConversation();


      if (!activeConversation) {

        const lastConversation =
          conversations[
            conversations.length - 1
          ];

        activeChatId =
          lastConversation.id;

        saveConversations();

      }


      renderActiveConversation();

      renderHistory();

    }


    /* =========================
       MIGRATE OLD HISTORY
    ========================= */

    function migrateOldHistory() {

      const OLD_STORAGE_KEY =
        "nexora_ai_chat_history";

      try {

        const oldHistory =
          localStorage.getItem(
            OLD_STORAGE_KEY
          );

        if (
          !oldHistory ||
          conversations.length > 0
        ) {

          return;

        }


        const messages =
          JSON.parse(
            oldHistory
          );


        if (
          !Array.isArray(messages) ||
          messages.length === 0
        ) {

          return;

        }


        const firstUserMessage =
          messages.find(
            (item) =>
              item.role === "user"
          );


        const title =
          firstUserMessage &&
          firstUserMessage.content
            ? generateConversationTitle(
                firstUserMessage.content
              )
            : "Percakapan sebelumnya";


        const migratedConversation = {

          id:
            Date.now().toString(),

          title:
            title,

          messages:
            messages,

          createdAt:
            messages[0].timestamp ||
            Date.now(),

          updatedAt:
            messages[
              messages.length - 1
            ].timestamp ||
            Date.now()

        };


        conversations.push(
          migratedConversation
        );

        activeChatId =
          migratedConversation.id;

        saveConversations();


        localStorage.removeItem(
          OLD_STORAGE_KEY
        );

      } catch (error) {

        console.error(
          "Gagal migrasi riwayat lama:",
          error
        );

      }

    }


    /* =========================
       AUTO TITLE
    ========================= */

    function generateConversationTitle(
      text
    ) {

      if (!text) {

        return "Percakapan baru";

      }


      let title =
        text
          .replace(/\s+/g, " ")
          .trim();


      if (!title) {

        return "Percakapan baru";

      }


      title =
        title.charAt(0).toUpperCase() +
        title.slice(1);


      if (title.length > 40) {

        title =
          title.slice(0, 40).trim() +
          "...";

      }


      return title;

    }


    /* =========================
       CLEAR DISPLAY
    ========================= */

    function clearChatDisplay() {

      const messages =
        chat.querySelectorAll(
          ".message-wrapper"
        );

      messages.forEach(
        (message) => {
          message.remove();
        }
      );

    }


    /* =========================
       RENDER ACTIVE CHAT
    ========================= */

    function renderActiveConversation() {

      clearChatDisplay();

      const conversation =
        getActiveConversation();


      if (
        !conversation ||
        conversation.messages.length === 0
      ) {

        welcome.style.display =
          "block";

        return;

      }


      welcome.style.display =
        "none";


      conversation.messages.forEach(
        (item) => {

          createMessageElement(
            item.role,
            item.content
          );

        }
      );


      setTimeout(() => {

        chat.scrollTop =
          chat.scrollHeight;

      }, 50);

    }


    /* =========================
       RENDER CHAT HISTORY
    ========================= */

    function renderHistory() {

      historyList.innerHTML = "";


      if (historyCount) {

        historyCount.textContent =
          conversations.length > 0
            ? `(${conversations.length})`
            : "";

      }


      if (
        conversations.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "history-empty";

        empty.textContent =
          "Belum ada percakapan.";

        historyList.appendChild(
          empty
        );

        return;

      }


      const sortedConversations =
        [...conversations].sort(
          (a, b) =>
            (b.updatedAt || b.createdAt || 0) -
            (a.updatedAt || a.createdAt || 0)
        );


      sortedConversations.forEach(
        (conversation) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "history-item";


          const isActive =
            conversation.id ===
            activeChatId;


          if (isActive) {

            item.classList.add(
              "active"
            );

          }


          const content =
            document.createElement(
              "div"
            );

          content.className =
            "history-item-content";


          const titleRow =
            document.createElement(
              "div"
            );

          titleRow.className =
            "history-item-title-row";


          const title =
            document.createElement(
              "div"
            );

          title.className =
            "history-item-title";

          title.textContent =
            conversation.title ||
            "Percakapan baru";


          titleRow.appendChild(
            title
          );


          if (isActive) {

            const activeLabel =
              document.createElement(
                "span"
              );

            activeLabel.className =
              "history-active-label";

            activeLabel.textContent =
              "Aktif";

            titleRow.appendChild(
              activeLabel
            );

          }


          const date =
            document.createElement(
              "div"
            );

          date.className =
            "history-item-date";

          date.textContent =
            formatDate(
              conversation.updatedAt ||
              conversation.createdAt
            );


          content.appendChild(
            titleRow
          );

          content.appendChild(
            date
          );


          /* =========================
             DELETE BUTTON
          ========================= */

          const deleteButton =
            document.createElement(
              "button"
            );

          deleteButton.className =
            "history-delete-button";

          deleteButton.type =
            "button";

          deleteButton.textContent =
            "🗑";

          deleteButton.title =
            "Hapus percakapan";

          deleteButton.setAttribute(
            "aria-label",
            "Hapus percakapan"
          );


          deleteButton.addEventListener(
            "click",
            (event) => {

              event.stopPropagation();

              deleteConversation(
                conversation
              );

            }
          );


          item.appendChild(
            content
          );

          item.appendChild(
            deleteButton
          );


          item.addEventListener(
            "click",
            () => {

              openConversation(
                conversation.id
              );

            }
          );


          historyList.appendChild(
            item
          );

        }
      );

    }


    /* =========================
       DELETE CONVERSATION
    ========================= */

    function deleteConversation(
      conversation
    ) {

      const confirmed =
        confirm(
          'Hapus percakapan "' +
          (
            conversation.title ||
            "Percakapan baru"
          ) +
          '"?\n\nPercakapan yang dihapus tidak dapat dikembalikan.'
        );


      if (!confirmed) {

        return;

      }


      const deletedId =
        conversation.id;


      conversations =
        conversations.filter(
          (item) =>
            item.id !== deletedId
        );


      /* =========================
         JIKA CHAT AKTIF DIHAPUS
      ========================= */

      if (
        activeChatId === deletedId
      ) {

        if (
          conversations.length > 0
        ) {

          const nextConversation =
            [...conversations].sort(
              (a, b) =>
                (b.updatedAt || b.createdAt || 0) -
                (a.updatedAt || a.createdAt || 0)
            )[0];


          activeChatId =
            nextConversation.id;

        } else {

          activeChatId =
            null;

          createConversation();

        }


        renderActiveConversation();

      }


      saveConversations();

      renderHistory();

    }


    /* =========================
       FORMAT DATE
    ========================= */

    function formatDate(timestamp) {

      if (!timestamp) {

        return "";

      }


      const date =
        new Date(timestamp);

      const now =
        new Date();


      const isToday =
        date.toDateString() ===
        now.toDateString();


      if (isToday) {

        return (
          "Hari ini • " +
          date.toLocaleTimeString(
            "id-ID",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        );

      }


      const yesterday =
        new Date();

      yesterday.setDate(
        yesterday.getDate() - 1
      );


      if (
        date.toDateString() ===
        yesterday.toDateString()
      ) {

        return "Kemarin";

      }


      return date.toLocaleDateString(
        "id-ID",
        {
          day: "numeric",
          month: "short",
          year: "numeric"
        }
      );

    }


    /* =========================
       OPEN CONVERSATION
    ========================= */

    function openConversation(
      conversationId
    ) {

      const conversation =
        conversations.find(
          (item) =>
            item.id ===
            conversationId
        );


      if (!conversation) {

        return;

      }


      activeChatId =
        conversation.id;


      saveConversations();

      renderActiveConversation();

      renderHistory();

      closeHistory();

      input.focus();

    }


    /* =========================
       HISTORY PANEL
    ========================= */

    function openHistory() {

      historyPanel.classList.add(
        "show"
      );

      historyOverlay.classList.add(
        "show"
      );

      renderHistory();

    }


    function closeHistory() {

      historyPanel.classList.remove(
        "show"
      );

      historyOverlay.classList.remove(
        "show"
      );

    }


    /* =========================
       ADD MESSAGE TO HISTORY
    ========================= */

    function addMessageToHistory(
      role,
      content
    ) {

      const conversation =
        getActiveConversation();


      if (!conversation) {

        return;

      }


      conversation.messages.push({

        role:
          role,

        content:
          content,

        timestamp:
          Date.now()

      });


      /* =========================
         AUTO RENAME
      ========================= */

      if (
        role === "user" &&
        (
          !conversation.title ||
          conversation.title ===
            "Percakapan baru"
        )
      ) {

        conversation.title =
          generateConversationTitle(
            content
          );

      }


      conversation.updatedAt =
        Date.now();


      saveConversations();

      renderHistory();

    }


    /* =========================
       CREATE MESSAGE ELEMENT
    ========================= */

    function createMessageElement(
      role,
      content
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      if (role === "user") {

        wrapper.className =
          "message-wrapper user-wrapper";

      } else {

        wrapper.className =
          "message-wrapper ai-wrapper";

      }


      const message =
        document.createElement(
          "div"
        );


      message.className =
        role === "user"
          ? "message user"
          : "message ai";


      message.textContent =
        content;


      wrapper.appendChild(
        message
      );


      chat.appendChild(
        wrapper
      );


      return message;

    }


    /* =========================
       NEW CHAT
    ========================= */

    function startNewChat() {

      if (button.disabled) {

        return;

      }


      const currentConversation =
        getActiveConversation();


      const hasMessages =
        currentConversation &&
        currentConversation.messages.length > 0;


      if (hasMessages) {

        const confirmed =
          confirm(
            "Mulai chat baru?\n\nPercakapan saat ini tetap tersimpan di browser."
          );


        if (!confirmed) {

          return;

        }

      }


      createConversation();

      renderActiveConversation();

      input.value = "";

      input.disabled = false;

      button.disabled = false;

      newChatButton.disabled = false;

      button.textContent =
        "Kirim";

      input.focus();

      chat.scrollTop = 0;

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const message =
        input.value.trim();


      if (
        !message ||
        button.disabled
      ) {

        return;

      }


      const conversation =
        getActiveConversation();


      if (!conversation) {

        createConversation();

      }


      welcome.style.display =
        "none";


      /* =========================
         SIMPAN PESAN USER
      ========================= */

      addMessageToHistory(
        "user",
        message
      );


      /* =========================
         TAMPILKAN PESAN USER
      ========================= */

      createMessageElement(
        "user",
        message
      );


      input.value = "";

      button.disabled = true;

      newChatButton.disabled =
        true;

      input.disabled = true;

      button.textContent =
        "Menjawab...";


      /* =========================
         AI THINKING
      ========================= */

      const aiWrapper =
        document.createElement(
          "div"
        );

      aiWrapper.className =
        "message-wrapper ai-wrapper";


      const aiMessage =
        document.createElement(
          "div"
        );

      aiMessage.className =
        "message ai";


      const thinking =
        document.createElement(
          "div"
        );

      thinking.className =
        "thinking";


      thinking.innerHTML = `
        <span>Nexora sedang berpikir</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      `;


      aiMessage.appendChild(
        thinking
      );

      aiWrapper.appendChild(
        aiMessage
      );

      chat.appendChild(
        aiWrapper
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message:
                  message
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Terjadi kesalahan pada server."
          );

        }


        const reply =
          data.reply ||
          "Nexora tidak memberikan jawaban.";


        /* =========================
           TAMPILKAN JAWABAN AI
        ========================= */

        aiMessage.textContent =
          reply;


        /* =========================
           SIMPAN JAWABAN AI
        ========================= */

        addMessageToHistory(
          "ai",
          reply
        );

      } catch (error) {

        console.error(
          "Nexora error:",
          error
        );


        const errorMessage =
          "Error Nexora: " +
          error.message;


        aiMessage.textContent =
          errorMessage;


        addMessageToHistory(
          "ai",
          errorMessage
        );

      }


      button.disabled = false;

      newChatButton.disabled =
        false;

      input.disabled = false;

      button.textContent =
        "Kirim";

      input.focus();

      chat.scrollTop =
        chat.scrollHeight;

    }


    /* =========================
       EVENTS
    ========================= */

    button.addEventListener(
      "click",
      sendMessage
    );


    newChatButton.addEventListener(
      "click",
      startNewChat
    );


    historyButton.addEventListener(
      "click",
      openHistory
    );


    closeHistoryButton.addEventListener(
      "click",
      closeHistory
    );


    historyOverlay.addEventListener(
      "click",
      closeHistory
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          sendMessage();

        }

      }
    );


    /* =========================
       LOAD
    ========================= */

    loadConversations();


    /* =========================
       PWA
    ========================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker.register(
            "/service-worker.js"
          );

        }
      );

    }

  </script>

</body>
</html>
