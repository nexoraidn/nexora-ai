<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora AI</title>

  <meta
    name="description"
    content="Nexora AI - Intelligent technology for a smarter future."
  >

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: #ffffff;
      overflow: hidden;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #1f1f1f;
      background: rgba(5, 5, 5, 0.95);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .chat {
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 30px 20px 120px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 10px;
    }

    .welcome {
      max-width: 700px;
      margin: 15vh auto 0;
      text-align: center;
      padding: 20px;
    }

    .welcome h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin-bottom: 14px;
      letter-spacing: -1px;
    }

    .welcome p {
      color: #888888;
      font-size: 16px;
    }

    .message-wrapper {
      max-width: 760px;
      margin: 18px auto;
      display: flex;
    }

    .message-wrapper.user-wrapper {
      justify-content: flex-end;
    }

    .message-wrapper.ai-wrapper {
      justify-content: flex-start;
    }

    .message {
      max-width: 80%;
      padding: 14px 17px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #ffffff;
      color: #000000;
      border-bottom-right-radius: 5px;
    }

    .ai {
      background: #111111;
      border: 1px solid #242424;
      color: #eeeeee;
      border-bottom-left-radius: 5px;
    }

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #888888;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    .input-area {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(92%, 760px);
      display: flex;
      gap: 10px;
      padding: 8px;
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      background: transparent;
      border: none;
      color: #ffffff;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: #666666;
    }

    button {
      padding: 12px 18px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }

    @media (max-width: 600px) {
      .chat {
        padding: 20px 12px 110px;
      }

      .welcome {
        margin-top: 18vh;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .message {
        max-width: 88%;
        font-size: 14px;
      }

      .input-area {
        bottom: 10px;
        width: 94%;
      }

      button {
        padding: 12px 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NEXORA AI</div>
  </header>

  <main id="chat" class="chat">

    <div id="welcome" class="welcome">
      <h1>Halo, saya Nexora AI.</h1>
      <p>Apa yang ingin kamu lakukan hari ini?</p>
    </div>

  </main>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Tanyakan sesuatu kepada Nexora AI..."
      autocomplete="off"
    >

    <button id="sendButton">
      Kirim
    </button>

  </div>

  <script>
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    async function sendMessage() {
      const message = input.value.trim();

      if (!message || button.disabled) {
        return;
      }

      welcome.style.display = "none";

      const userWrapper = document.createElement("div");
      userWrapper.className = "message-wrapper user-wrapper";

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      userWrapper.appendChild(userMessage);
      chat.appendChild(userWrapper);

      input.value = "";

      button.disabled = true;
      input.disabled = true;
      button.textContent = "Menjawab...";

      const aiWrapper = document.createElement("div");
      aiWrapper.className = "message-wrapper ai-wrapper";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";

      const thinking = document.createElement("div");
      thinking.className = "thinking";

      thinking.innerHTML = `
        <span>Nexora sedang berpikir</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      `;

      aiMessage.appendChild(thinking);
      aiWrapper.appendChild(aiMessage);
      chat.appendChild(aiWrapper);

      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Terjadi kesalahan pada server."
          );
        }

        aiMessage.textContent =
          data.reply || "Nexora tidak memberikan jawaban.";

      } catch (error) {
        console.error("Nexora error:", error);

        aiMessage.textContent =
          "Error Nexora: " + error.message;
      }

      button.disabled = false;
      input.disabled = false;
      button.textContent = "Kirim";

      input.focus();

      chat.scrollTop = chat.scrollHeight;
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    /* PWA */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>

</body>
</html>
