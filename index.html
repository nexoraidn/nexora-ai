<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora AI</title>

  <meta
    name="description"
    content="Nexora AI - Intelligent technology for a smarter future."
  >

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 24px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #888;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 25px;
      font-size: 14px;
    }

    nav a:hover {
      color: white;
    }

    main {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero {
      max-width: 800px;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid #333;
      border-radius: 30px;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 90px);
      line-height: 1;
      margin-bottom: 25px;
      letter-spacing: -3px;
    }

    .gradient {
      background: linear-gradient(90deg, #ffffff, #777777);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      color: #999;
      font-size: 18px;
      line-height: 1.7;
      max-width: 600px;
      margin: auto;
    }

    .buttons {
      margin-top: 35px;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin: 5px;
    }

    .primary {
      background: white;
      color: black;
    }

    .secondary {
      border: 1px solid #333;
      color: white;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NEXORA<span> AI</span></div>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
    </nav>
  </header>

  <main>
    <section class="hero">

      <div class="badge">
        Next Generation Intelligence
      </div>

      <h1>
        Intelligence for a
        <span class="gradient">smarter future.</span>
      </h1>

      <p class="description">
        Nexora AI adalah platform teknologi kecerdasan buatan
        yang dirancang untuk membantu manusia bekerja,
        berpikir, dan berkembang lebih cerdas.
      </p>

      <div class="buttons">
        <a href="chat.html" class="btn primary">
          Mulai Nexora AI
        </a>

        <a href="#" class="btn secondary">
          Pelajari Nexora
        </a>
      </div>

    </section>
  </main>

  <footer>
    © 2026 Nexora AI. All rights reserved.
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>

</body>
</html>
